name: CI on main

on:
  push:
    branches:
    - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml

  build_and_test:
    needs: lint
    name: Build and test
    uses: ./.github/workflows/build_and_test.yml
