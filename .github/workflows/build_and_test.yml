name: Cargo Build & Test

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Prefix keeps this group distinct from the caller's group when run via workflow_call
  group: build-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    # fmt and clippy run in lint.yml, this job only builds and tests
    name: Test (${{ matrix.toolchain }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        toolchain:
        - stable
        os:
        - macos-latest
        - macos-15-intel
        - ubuntu-latest
        - ubuntu-24.04-arm
        - windows-latest
        include:
        # MSRV: must match rust-version in Cargo.toml
        - { toolchain: "1.90", os: ubuntu-latest }
        # Early warning only: beta and nightly failures do not fail the PR
        - { toolchain: beta, os: ubuntu-latest, experimental: true }
        - { toolchain: nightly, os: ubuntu-latest, experimental: true }
    continue-on-error: ${{ matrix.experimental == true }}
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7

    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.toolchain }}

    - uses: Swatinem/rust-cache@v2

    - name: Install ALSA development libraries
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev

    - run: cargo test --locked --verbose
