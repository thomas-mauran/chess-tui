name: Security audit

on:
  schedule:
  # Mondays 06:00 UTC: catches advisories published against unchanged deps
  - cron: "0 6 * * 1"
  pull_request:
    paths:
    - Cargo.toml
    - Cargo.lock
  push:
    branches:
    - main
    paths:
    - Cargo.toml
    - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-audit
    - run: cargo audit
